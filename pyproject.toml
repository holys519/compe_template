[project]
name = "competition-template"
version = "0.1.0"
description = "A portable Kaggle experiment template for Mac, RTX 3090, and GPU clusters"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "ruff>=0.12",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
