version = 1
id = "__EXP__"
title = __TITLE__
environment = "__ENV__"
status = "planned"
created_at = "__DATE__"
base = __BASE__
hypothesis = __HYPOTHESIS__
change = __CHANGE__
notes = ""
tags = []

# --- pre-registration (fill BEFORE running; never edit after seeing results) ---
[preregistration]
baseline = ""        # frozen artifact B: path + sha (+ dependency versions)
candidate = ""       # frozen artifact C: path + sha
reference = ""       # frozen opponent / dataset / fold set R
unit = "seed"        # independent unit: seed | fold | group
units = ""           # registered block, e.g. "NNNNN-MMMMM (docs/evaluation-protocol.md row)"
min_effect = 0.0     # smallest effect worth acting on
alpha = 0.05         # with sidedness and family declared below
sidedness = "two"    # "one" | "two"
family = 1           # number of confirmations sharing this alpha
decision = "one look: accept if the declared bound excludes 0 in the good direction; reject if it excludes 0 in the bad direction; else inconclusive (keep baseline)"
guards = ["errors == 0 and fallback_count == 0", "all units present exactly once", "runtime within limit"]

# Replace this smoke-test gate with the competition's real, pre-registered criterion.
[[success_criteria]]
metric = "pipeline_ok"
op = ">="
value = 1.0
